[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clean"
version = "0.2.0"
description = "A fast, unified CLI tool to sanitize file and folder names for Kaggle uploads and Mobile/Syncthing syncing"
readme = "README.md"
authors = [{ name = "Clean Contributors" }]
requires-python = ">=3.8"
dependencies = []

[project.scripts]
clean = "clean.cli:main"
kaggle_clean = "clean.cli:main"
kaggle-clean = "clean.cli:main"
kagle_clean = "clean.cli:main"
sync_clean = "clean.cli:main"
sync-clean = "clean.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clean*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
