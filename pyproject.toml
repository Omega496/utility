[project]
name = "utility"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=2.0",
]

[project.scripts]
utility = "utility:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "make-pdf",
    "Make-audio",
    "kaggle_clean",
]
